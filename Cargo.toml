[package]
name = "tree-sitter-asl"
version = "0.1.0"
edition = "2024"
description = "tree-sitter grammar for ACPI Source Language"
readme = "README.md"
repository = "https://github.com/tabulatejarl8/tree-sitter-asl"
license = "MIT"
keywords = ["asl", "incremental", "parsing", "tree-sitter"]
categories = ["parser-implementations", "parsing", "text-editors"]
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.26.9"

[build-dependencies]
cc = "1.2"
