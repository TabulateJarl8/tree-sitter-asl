[project]
name = "tree-sitter-asl"
version = "0.1.0"
description = "ACPI Source Language"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Connor Sample", email = "tabulatejarl8@gmail.com" }]
keywords = ["asl", "incremental", "parsing", "tree-sitter"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]

[project.urls]
Funding = "https://ko-fi.com/tabulate"
Homepage = "https://github.com/tabulatejarl8/tree-sitter-asl"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
